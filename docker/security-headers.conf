# The page may only talk to the forecast and site-data APIs, straight from the visitor's browser.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com https://pg.vrana.cz https://api.windy.com https://my.meteoblue.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
# Don't tell the APIs (or any link target) which page the visitor came from.
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# Static file server for Launch Window. It stores nothing about visitors:
# no access log, no cookies, no server-side state. Error logging is limited to
# critical errors, because ordinary error lines include the client's IP address.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    log_not_found off;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # The image runs with a read-only filesystem; nginx only needs /tmp (a tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1k;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Read-only site: nothing can be uploaded or posted.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location /fonts/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            return 404;
        }
    }
}
